<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First Website</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="galaxy">
    <section class="cinematic-intro" aria-label="Cinematic sci-fi battle intro">
      <div class="space-battle">
        <div class="planet"></div>
        <div class="battle-photo-wrap" aria-label="RasulTech picture in the battle">
          <img src="my-photo.jpg" alt="RasulTech" class="battle-photo">
          <span>RasulTech</span>
        </div>
        <div class="ship ship-one"></div>
        <div class="ship ship-two"></div>
        <div class="laser laser-one"></div>
        <div class="laser laser-two"></div>
        <div class="laser laser-three"></div>
        <div class="battlefield">
          <div class="soldier soldier-one">
            <span class="helmet"></span>
            <span class="rifle"></span>
          </div>
          <div class="soldier soldier-two">
            <span class="helmet"></span>
            <span class="rifle"></span>
          </div>
        </div>
      </div>
      <div class="logo-build" aria-label="Rasul is here">
        <span class="logo-letter fly-a">R</span>
        <span class="logo-letter fly-b">a</span>
        <span class="logo-letter fly-c">s</span>
        <span class="logo-letter fly-d">u</span>
        <span class="logo-letter fly-e">l</span>
        <span class="logo-space">&nbsp;</span>
        <span class="logo-letter fly-f">i</span>
        <span class="logo-letter fly-g">s</span>
        <span class="logo-space">&nbsp;</span>
        <span class="logo-letter fly-h">h</span>
        <span class="logo-letter fly-i">e</span>
        <span class="logo-letter fly-j">r</span>
        <span class="logo-letter fly-k">e</span>
      </div>
      <div class="intro-ring"></div>
    </section>
  </main>

  <main class="home">
    <section class="hero">
      <div class="portrait-card">
        <img
          src="my-photo.jpg"
          alt="Rasul's photo"
          class="profile-photo"
          onerror="this.classList.add('missing-photo')"
        >
        <div class="photo-fallback">
          Add your photo as<br>
          <strong>my-photo.jpg</strong>
        </div>
      </div>

      <div class="intro">
        <p class="eyebrow">My First Website</p>
        <h1>Rasul is here</h1>
        <p class="highlight">Owner of this Page</p>
        <p>
          I am learning how to build and publish a website with GitHub.
        </p>
        <button onclick="sayHello()">Click Me</button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
