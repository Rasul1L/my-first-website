<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First Website</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="galaxy">
    <section class="cinematic-intro" aria-label="Cinematic sci-fi battle intro">
      <div class="space-battle">
        <div class="planet"></div>
        <div class="ship ship-one"></div>
        <div class="ship ship-two"></div>
        <div class="laser laser-one"></div>
        <div class="laser laser-two"></div>
        <div class="laser laser-three"></div>
        <div class="battlefield">
          <div class="soldier soldier-one">
            <span class="helmet"></span>
            <span class="rifle"></span>
          </div>
          <div class="soldier soldier-two">
            <span class="helmet"></span>
            <span class="rifle"></span>
          </div>
          <div class="warrior warrior-one">
            <span class="hood"></span>
            <span class="energy-sword sword-blue"></span>
          </div>
          <div class="warrior warrior-two">
            <span class="hood"></span>
            <span class="energy-sword sword-red"></span>
          </div>
          <div class="impact impact-one"></div>
          <div class="impact impact-two"></div>
        </div>
      </div>
    </section>

    <section class="hero">
      <div class="portrait-card">
        <img
          src="my-photo.jpg"
          alt="Rasul's photo"
          class="profile-photo"
          onerror="this.classList.add('missing-photo')"
        >
        <div class="photo-fallback">
          Add your photo as<br>
          <strong>my-photo.jpg</strong>
        </div>
      </div>

      <div class="intro">
        <p class="episode">Episode I</p>
        <h1 data-assemble data-assemble-delay="5200">Rasul is here</h1>
        <p class="crawl-text">
          Owner of this Page
        </p>
        <p>
          I am learning how to build and publish a website with GitHub, one
          hyperspace jump at a time.
        </p>
        <button onclick="sayHello()">Activate The Force</button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
