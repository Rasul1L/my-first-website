<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First Website</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="galaxy">
    <section class="hero">
      <div class="portrait-card">
        <img
          src="my-photo.jpg"
          alt="Rasul's photo"
          class="profile-photo"
          onerror="this.classList.add('missing-photo')"
        >
        <div class="photo-fallback">
          Add your photo as<br>
          <strong>my-photo.jpg</strong>
        </div>
      </div>

      <div class="intro">
        <p class="episode">Episode I</p>
        <h1 data-assemble>Rasul Prime</h1>
        <p class="crawl-text" data-assemble>
          Owner of this Page
        </p>
        <p>
          I am learning how to build and publish a website with GitHub, one
          hyperspace jump at a time.
        </p>
        <button onclick="sayHello()">Activate The Force</button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
