<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RasulTech | Project Studio</title>
  <meta name="description" content="A premium dark digital portfolio for RasulTech projects: BrandScan AI and Personal Time Capsule.">
  <meta property="og:title" content="RasulTech | Project Studio">
  <meta property="og:description" content="Explore RasulTech projects in a cinematic dark portfolio experience.">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="world-theme.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="galaxy">
    <section class="cinematic-intro premium-name-intro" aria-label="RasulTech cinematic intro">
      <div class="intro-particles" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
      <div class="logo-build" aria-label="RasulTech">
        <span class="logo-letter fly-a">R</span>
        <span class="logo-letter fly-b">a</span>
        <span class="logo-letter fly-c">s</span>
        <span class="logo-letter fly-d">u</span>
        <span class="logo-letter fly-e">l</span>
        <span class="logo-letter fly-f">T</span>
        <span class="logo-letter fly-g">e</span>
        <span class="logo-letter fly-h">c</span>
        <span class="logo-letter fly-i">h</span>
      </div>
      <div class="intro-ring"></div>
    </section>
  </main>

  <main class="home">
    <header class="site-header" aria-label="Primary navigation">
      <a class="site-brand" href="index.html">RasulTech</a>
      <nav>
        <a href="products.html">Projects</a>
      </nav>
    </header>

    <section class="hero name-platform-hero">
      <div class="menu-atmosphere" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </div>
      <div class="hero-sky" aria-hidden="true">
        <span class="sky-glow"></span>
        <span class="sky-horizon"></span>
        <div class="star-field star-field-one"></div>
        <div class="star-field star-field-two"></div>
        <div class="shooting-star"></div>
        <div class="hero-particles">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
      <div class="hero-minimal">
        <p class="eyebrow">RasulTech</p>
        <h1>RasulTech</h1>
        <div class="hero-actions" aria-label="World selection">
          <button class="world-trigger" type="button" id="open-world-modal">Enter the Cosmos</button>
        </div>
      </div>
    </section>
  </main>

  <section class="world-modal" id="world-modal" aria-label="Choose your world" aria-modal="true" role="dialog" hidden>
    <div class="world-modal-backdrop" data-close-world></div>
    <div class="world-panel">
      <div class="world-panel-top">
        <div>
          <p class="eyebrow">Atmosphere</p>
          <h2>Choose Your World</h2>
        </div>
        <button class="world-close" type="button" aria-label="Close world chooser" data-close-world>Close</button>
      </div>

      <div class="world-grid">
        <button class="world-card world-card-space" type="button" data-world="space">
          <span>Space</span>
          <strong>Deep space, stars, nebulas, planets, dark futuristic atmosphere.</strong>
        </button>
        <button class="world-card world-card-beach" type="button" data-world="beach">
          <span>Beach</span>
          <strong>Ocean waves, sunset, palm trees, warm relaxing colors.</strong>
        </button>
        <button class="world-card world-card-antarctica" type="button" data-world="antarctica">
          <span>Antarctica</span>
          <strong>Ice mountains, snow, northern lights, cold blue atmosphere.</strong>
        </button>
        <button class="world-card world-card-jungle" type="button" data-world="jungle">
          <span>Jungle</span>
          <strong>Tropical rainforest, mist, exotic plants, deep green colors.</strong>
        </button>
        <button class="world-card world-card-desert" type="button" data-world="desert">
          <span>Desert</span>
          <strong>Sand dunes, orange sunset, cinematic landscape.</strong>
        </button>
        <button class="world-card world-card-cyber" type="button" data-world="cyber">
          <span>Cyber City</span>
          <strong>Futuristic skyline, neon lights, high-tech atmosphere.</strong>
        </button>
      </div>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
